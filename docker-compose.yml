services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - portfolio-data:/app/storage
    expose:
      - "3000"

  # Terminates HTTPS (certificates from Let's Encrypt, renewed automatically).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. DOMAIN=harisyunanda.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  portfolio-data:
  caddy-data:
  caddy-config:
